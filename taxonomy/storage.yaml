domain: storage
features:
- id: storage
  level: L1
  parent: null
  name:
    zh: 数据与存储
    en: Data and Storage
  definition: 应用沙箱与用户文件访问、本地库/键值、端云同步、备份归档、共享与静态加密等数据持久化能力。
  knowledge_role: rollup
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  knowledge_path: knowledge/storage/_rollup.yaml
  bindings: {}
  comparison_scope:
    includes:
    - 文件访问、数据库、键值、云同步、备份、归档、共享、加密、索引、文档、类型标识
    excludes:
