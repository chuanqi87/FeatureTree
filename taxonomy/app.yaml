- id: app.background.foreground_task
  level: L3
  parent: app.background
  name:
    zh: 前台长时任务
    en: Foreground Long-Running Task
  definition: 向用户明示的长时后台工作（如下载、导航）。
  knowledge_role: leaf
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  leaf_at_this_level: true
  split_justification: background
  aliases:
  - Foreground Service
  - BGTaskScheduler
  - Background Task
  bindings:
    android:
    - kind: class
      id: android.app.Service
      url: https://developer.android.com/reference/android/app/Service
      role: primary
      note: Foreground service + types
    ios:
    - kind: framework
      id: BackgroundTasks
      url: https://developer.apple.com/documentation/backgroundtasks
      role: primary
    harmonyos:
    - kind: module
      id: '@ohos.resourceschedule.backgroundTaskManager'
      url: https://developer.huawei.com/consumer/cn/doc/harmonyos-references/js-apis-resourceschedule-backgroundtaskmanager
      role: primary
  knowledge_path: knowledge/app/background/foreground_task.yaml
