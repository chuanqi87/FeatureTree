- id: notifications.push.channel
  level: L3
  parent: notifications.push
  name:
    zh: 推送通道
    en: Push Delivery Channel
  definition: FCM / APNs / Push Kit 远程消息通道。
  knowledge_role: leaf
  layer: ecosystem
  device_forms:
  - phone
  - tablet
  privacy_class: none
  leaf_at_this_level: true
  split_justification: task
  aliases:
