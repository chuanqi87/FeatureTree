domain: location
features:
- id: location
  level: L1
  parent: null
  name:
    zh: 位置与地理
    en: Location and Geospatial
  definition: 设备定位、地理围栏、地图展示、地理编码与航向；不含近场 UWB/蓝牙测距（见 connectivity）。
  knowledge_role: rollup
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  knowledge_path: knowledge/location/_rollup.yaml
  bindings: {}
  comparison_scope:
    includes:
    - 定位、围栏、地图、地理编码、航向
    excludes:
    - UWB/测距见 connectivity.peripherals
    - 天气业务数据非地理编码
