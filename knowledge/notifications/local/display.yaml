definition: 通知栏/横幅/锁屏通知展示与渠道。
presence:
  android:
    status: unknown
    verification: unreviewed
  ios:
    status: unknown
    verification: unreviewed
  harmonyos:
    status: unknown
    verification: unreviewed
programming_model:
  android: NotificationChannel + NotificationManager.notify
  ios: UNUserNotificationCenter
  harmonyos: notificationManager.publish(NotificationRequest)（callback/Promise）；授权可用 requestEnableNotification(context)
lifecycle_background:
  notes: 展示本身是 OS 能力；勿与远程推送通道（FCM/APNs/Push Kit）混绑。
permissions_privacy:
  android: POST_NOTIFICATIONS (API 33+)
  ios: 用户通知授权 + 焦点模式
  harmonyos: 发布前常需 requestEnableNotification；具体权限以 Notification Kit 文档为准
  cross_ref:
  - security.permissions.runtime
porting_traps:
- from: ios
  to: android
  trap: 忽略通知渠道（Channel）导致用户无法精细关闭类别。
- from: android
  to: harmonyos
  trap: 假设 publish 前无需用户开启通知开关（漏调 requestEnableNotification）。
