api_surface: Android ScanSettings 回调类型常量、鸿蒙 ScanDuty/MatchMode 枚举命名差异，不成子叶。
legacy_presence:
  android:
    status: full
    rationale: BluetoothLeScanner.startScan 支持 ScanFilter 列表（官方 Find BLE devices 指南）。
  ios:
    status: partial
    rationale: CBCentralManager 扫描以 service UUID 为主过滤；厂商数据等通常需应用层再过滤。
    missing_subcapabilities:
    - connectivity.bluetooth.le.scan.batch
  harmonyos:
    status: full
    rationale: 'ble.startBLEScan(filters: ScanFilter[], options?)；ScanFilter 示例含 deviceId/name/serviceUuid。'
