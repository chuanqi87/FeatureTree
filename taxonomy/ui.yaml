domain: ui
features:
- id: ui
  level: L1
  parent: null
  name:
    zh: 界面与窗口
    en: UI and Windowing
  definition: 应用界面范式、布局、控件、导航、窗口形态、主题、动效与系统壳层 UI 集成；不含无障碍与原生绘图底层。
  knowledge_role: rollup
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  knowledge_path: knowledge/ui/_rollup.yaml
  bindings: {}
  comparison_scope:
    includes:
    - 声明/命令式 UI、布局容器、控件、导航、多窗、主题资源、动画、桌面壳/表盘 UI 入口
    excludes:
    - a11y 无障碍树
    - graphics 底层绘制
    - app.desktop 小组件宿主生命周期
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
  granularity: branch
  anchor_status: unverified
  legacy:
    disposition: kept
    sources:
    - ui
- id: ui.animation
  level: L2
  parent: ui
  name:
    zh: 动效与动画
    en: Animation and Motion
  definition: 属性动画、转场、曲线与共享元素过渡。
  knowledge_role: rollup
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  knowledge_path: knowledge/ui/animation/_rollup.yaml
  bindings: {}
  comparison_scope:
    includes:
    - property、transition、curve、shared_element
    excludes:
    - 控件内帧动画见 ui.controls.image
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
  granularity: branch
  anchor_status: unverified
  legacy:
    disposition: new
    sources: []
  sibling_axis: ui_concern
