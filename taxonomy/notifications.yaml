  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
  granularity: branch
  anchor_status: unverified
  legacy:
    disposition: kept
    sources:
    - notifications
