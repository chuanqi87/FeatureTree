- id: ui.declarative.vs_imperative
  level: L3
  parent: ui.declarative
  name:
    zh: 状态驱动界面更新
    en: State-driven UI Updates
  definition: 将应用状态变化同步为界面变化，并维护状态与显示的一致性。
  knowledge_role: leaf
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  leaf_at_this_level: true
  split_justification: analog
  bindings:
    android:
    - kind: package
      id: androidx.compose.ui
      url: https://developer.android.com/reference/kotlin/androidx/compose/ui/package-summary
      role: primary
      note: 声明式
    ios:
    - kind: framework
      id: SwiftUI
      url: https://developer.apple.com/documentation/swiftui
      role: primary
    - kind: framework
      id: UIKit
      url: https://developer.apple.com/documentation/uikit
      role: related
    harmonyos:
    - kind: kit
      id: ArkUI
      url: https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/arkui-overview
      role: primary
  knowledge_path: knowledge/ui/declarative/vs_imperative.yaml
  aliases:
  - 声明式与命令式模型对照
  comparison_scope:
    includes:
    - 状态与界面绑定
    - 更新触发与更新范围
    - 状态保存与组件生命周期的协作
    excludes:
    - 按钮等具体控件的属性全集
  notes: 保留历史 ID 以维持引用；节点名称和比较对象已中立化。
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
