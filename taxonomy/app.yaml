domain: app
features:
- id: app
  level: L1
  parent: null
  name:
    zh: 应用模型
    en: Application Model
  definition: 应用进程与组件生命周期、后台约束、扩展点、桌面与安装更新。
  knowledge_role: rollup
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  knowledge_path: knowledge/app/_rollup.yaml
  bindings: {}
  comparison_scope:
    includes:
    - 应用进程与组件生命周期、后台约束、扩展点、桌面与安装更新。
    excludes: []
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
