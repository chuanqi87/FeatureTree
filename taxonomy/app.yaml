domain: app
features:
- id: app
  level: L1
  parent: null
  name:
    zh: 应用模型
    en: Application Model
  definition: 应用组件模型、生命周期、进程、后台执行、启动、桌面呈现、安装更新与系统扩展点。
  knowledge_role: rollup
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  knowledge_path: knowledge/app/_rollup.yaml
  bindings: {}
  comparison_scope:
    includes:
    - model、lifecycle、process、background、launch、desktop、install、extensions
    excludes:
    - ui 窗口与控件
    - runtime 语言/包管理底层
    - enterprise 设备策略
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
  granularity: branch
  anchor_status: unverified
  legacy:
    disposition: kept
    sources:
    - app
- id: app.background
  level: L2
  parent: app
  name:
    zh: 后台执行
    en: Background Execution
  definition: 前台长时任务、延迟条件任务与短暂延缓挂起。
  knowledge_role: rollup
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  knowledge_path: knowledge/app/background/_rollup.yaml
  bindings: {}
  comparison_scope:
    includes:
    - foreground_task、deferred_work、transient
    excludes:
    - 播放后台续播见 media.playback
    - 推送见 notifications
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
  granularity: branch
  anchor_status: unverified
  legacy:
    disposition: kept
    sources:
    - app.background
  sibling_axis: app_runtime_concern
