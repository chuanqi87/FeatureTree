- id: location.positioning.background
  level: L3
  parent: location.positioning
  name:
    zh: 后台定位
    en: Background Location
  definition: 应用不可见时持续或间歇获取位置。
  knowledge_role: leaf
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: highly_sensitive
  leaf_at_this_level: true
  split_justification: privacy
  bindings:
    android:
    - kind: other
      id: com.google.android.gms.location
      url: https://developers.google.com/android/reference/com/google/android/gms/location/FusedLocationProviderClient
      role: primary
      note: Fused location / background
    ios:
    - kind: framework
      id: CoreLocation
      url: https://developer.apple.com/documentation/corelocation
      role: primary
    harmonyos:
    - kind: module
      id: '@ohos.geoLocationManager'
      url: https://developer.huawei.com/consumer/cn/doc/harmonyos-references/js-apis-geolocationmanager
      role: primary
  knowledge_path: knowledge/location/positioning/background.yaml
  comparison_scope:
