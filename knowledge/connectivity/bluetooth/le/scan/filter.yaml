feature_id: connectivity.bluetooth.le.scan.filter
role: leaf
status: reviewed
baseline:
  android: API 35 (docs-raw/android/guide-pages/find-ble-devices.md)
  ios: iOS 18 / Core Bluetooth doc (docs-raw/ios/frameworks/corebluetooth.md)
  harmonyos: OpenHarmony Connectivity Kit @ohos.bluetooth.ble (docs-raw/harmonyos/api-index/modules/js-apis-bluetooth-ble.md)
  gms: n/a
  hms: n/a
definition: 按指定条件筛选 BLE 扫描结果，并明确过滤的执行位置与结果语义。
presence:
  android:
    status: unknown
    verification: in_review
  ios:
    status: unknown
    verification: in_review
  harmonyos:
    status: unknown
    verification: unreviewed
programming_model:
  android: bluetoothAdapter.bluetoothLeScanner.startScan(callback | filters+settings+callback)
  ios: CBCentralManager.scanForPeripherals(withServices:options:)
  harmonyos: import { ble } from '@kit.ConnectivityKit'; ble.startBLEScan([scanFilter], scanOptions)
  notes: 鸿蒙文档明确单路扫描——再次 start 前须 stopBLEScan；filters=null 可扫全部但不建议。
lifecycle_background:
  android: 扫描耗电高；指南要求找到设备即停、设时限、禁止循环扫。
  ios: 后台受蓝牙后台模式约束；iOS 26+ 若已有 CBManager 并启动 Live Activity，后台可获得接近前台的扫描特权（含无 service UUID / 允许重复）。
  harmonyos: 需 ACCESS_BLUETOOTH；后台持续扫描另受能效/后台任务策略约束（见 sibling background 叶子）。
permissions_privacy:
  android: BLUETOOTH_SCAN 等（API 31+ 拆分）；部分机型/场景仍与位置相关。
  ios: NSBluetoothAlwaysUsageDescription / NSBluetoothPeripheralUsageDescription 等用途字符串。
  harmonyos: ohos.permission.ACCESS_BLUETOOTH；SysCap SystemCapability.Communication.Bluetooth.Core
  cross_ref:
  - security.permissions.runtime
limits_precision:
  android: 扫描窗口/模式与硬件过滤相关；有配额与电池指南。
  ios: 系统调度扫描窗口；应用侧过滤字段少于 Android/鸿蒙 ScanFilter。
  harmonyos: ScanOptions 含 interval / dutyMode / matchMode；过滤字段见 ScanFilter。
porting_traps:
- from: android
  to: ios
  trap: 以为厂商数据/设备名过滤在 Core Bluetooth 与 ScanFilter 同等完备。
- from: ios
  to: harmonyos
  trap: 忽略鸿蒙「同时只能一路 startBLEScan」约束，连续两次 start 而不 stop。
- from: android
  to: harmonyos
  trap: 仍使用已停用的 @ohos.bluetooth / bluetoothManager 入口，而非 @kit.ConnectivityKit ble。
