domain: ui
features:
- id: ui
  level: L1
  parent: null
  name:
    zh: 界面与窗口
    en: UI and Windowing
  definition: 布局、控件、导航、窗口形态与主题。
  knowledge_role: rollup
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  knowledge_path: knowledge/ui/_rollup.yaml
  bindings: {}
  comparison_scope:
    includes:
    - 布局、控件、导航、窗口形态与主题。
    excludes: []
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
