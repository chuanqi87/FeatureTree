domain: interop
features:
- id: interop
  level: L1
  parent: null
  name:
    zh: 跨应用协作
    en: Cross-App Interop
  definition: 系统分享、深度链接、跨应用动作分发、数据传递与轻量即时体验入口。
  knowledge_role: rollup
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  knowledge_path: knowledge/interop/_rollup.yaml
  bindings: {}
  comparison_scope:
    includes:
    - share、deeplink、action_dispatch、data_transfer、lightweight_ui
    excludes:
    - 分布式跨端 Continuity 见 distributed
    - 账号联邦登录见 identity
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
  granularity: branch
  anchor_status: unverified
  legacy:
    disposition: kept
    sources:
    - interop
