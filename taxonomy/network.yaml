domain: network
features:
- id: network
  level: L1
  parent: null
  name:
    zh: 网络
    en: Networking
  definition: IP 层及以上的应用联网：HTTP、套接字、WebSocket、VPN、RPC、切换与发现；不含近距无线连接。
  knowledge_role: rollup
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  knowledge_path: knowledge/network/_rollup.yaml
  bindings: {}
  comparison_scope:
    includes:
    - HTTP、Socket、WebSocket、VPN、RPC、切换、发现、连接状态
    excludes:
    - 近距无线见 connectivity
    - 本地热点见 connectivity.wifi.hotspot_local（network.hotspot* 已合并）
    - 蜂窝通话见 telecom
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
  granularity: branch
  anchor_status: unverified
  legacy:
    disposition: kept
    sources:
    - network
  notes: network.hotspot / network.hotspot.local legacy 去向：connectivity.wifi.hotspot_local (merged_from)。
