  bindings:
    android:
    - kind: class
      id: SpringAnimation
      url: https://developer.android.com/reference/androidx/dynamicanimation/animation/SpringAnimation
      role: primary
    ios:
    - kind: class
      id: spring
      url: https://developer.apple.com/documentation/swiftui/animation/spring(response:dampingfraction:blendduration:)
      role: primary
    harmonyos:
    - kind: module
