feature_id: connectivity.bluetooth.le.scan.background
role: leaf
status: draft
baseline:
  android: API 35
  ios: Core Bluetooth + ActivityKit notes (docs-raw/ios/frameworks/corebluetooth.md)
  harmonyos: Connectivity Kit ble + Backgroundtasks Kit
  gms: n/a
  hms: n/a
definition: 应用不在前台时继续或受限的 BLE 扫描。
presence:
  android:
    status: unknown
    verification: unreviewed
  ios:
    status: unknown
    verification: unreviewed
  harmonyos:
    status: unknown
    verification: unreviewed
programming_model:
  android: 常需结合前台服务或受限的 Job/Work；仍走 BluetoothLeScanner。
  ios: UIBackgroundModes bluetooth-central；可选 Live Activity 延长特权（见 Core Bluetooth Overview）。
  harmonyos: ble.startBLEScan + 系统后台约束；与 resourceschedule.backgroundTaskManager 交叉。
  notes: 三家均为受限模型，标 partial 而非 full。
lifecycle_background:
  android: Doze / App Standby / 前台服务类型。
  ios: 蓝牙后台模式；iPad-on-Mac 不支持 Core Bluetooth 后台执行模式（官方 Overview）。
  harmonyos: backgroundTask / 能效策略。
  notes: 与 app.background.* 交叉引用，不在此复述整套后台哲学。
permissions_privacy:
  android: BLUETOOTH_SCAN 等。
  ios: 蓝牙用途字符串 + 后台模式声明。
  harmonyos: ohos.permission.ACCESS_BLUETOOTH
  cross_ref:
  - security.permissions.runtime
  - app.background.foreground_task
porting_traps:
- from: android
  to: ios
  trap: 把前台服务保活扫描直接等价为 iOS 后台 BLE。
- from: ios
  to: android
  trap: 假设 Live Activity 特权在 Android 有一一对应物。
