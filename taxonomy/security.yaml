- id: security.permissions.runtime
  level: L3
  parent: security.permissions
  name:
    zh: 运行时权限请求
    en: Runtime Permission Request
  definition: 运行时向用户请求危险权限。
  knowledge_role: leaf
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: runtime_permission
  leaf_at_this_level: true
  split_justification: analog
  bindings:
    android:
    - kind: class
      id: android.content.pm.PackageManager
      url: https://developer.android.com/reference/android/content/pm/PackageManager
      role: related
      note: requestPermissions
    ios:
    - kind: other
      id: Info.plist usage descriptions + per-API prompts
      url: https://developer.apple.com/documentation/uikit/requesting-access-to-protected-resources
      role: primary
    harmonyos:
    - kind: module
      id: '@ohos.abilityAccessCtrl'
      url: https://developer.huawei.com/consumer/cn/doc/harmonyos-references/js-apis-abilityaccessctrl
      role: primary
  knowledge_path: knowledge/security/permissions/runtime.yaml
  comparison_scope:
    includes:
    - 运行时向用户请求危险权限。
    excludes: []
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
