- id: interop.action_dispatch.component_intent
  level: L3
  parent: interop.action_dispatch
  name:
    zh: 目标组件调用
    en: Target Component Invocation
  definition: 定位并调用应用组件，传递调用参数并处理无法找到目标等结果。
  knowledge_role: leaf
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  leaf_at_this_level: true
  split_justification: analog
  aliases:
  - Intent
  - Want
  - 组件意图跳转
  bindings:
    android:
    - kind: class
      id: android.content.Intent
      role: primary
      url: https://developer.android.com/reference/android/content/Intent
    harmonyos:
    - kind: module
      id: '@ohos.app.ability.Want'
      url: https://developer.huawei.com/consumer/cn/doc/harmonyos-references/js-apis-app-ability-want
      role: primary
      note: analog to Intent
  knowledge_path: knowledge/interop/action_dispatch/component_intent.yaml
  comparison_scope:
    includes:
    - 显式指定目标组件
    - 按声明的能力解析目标
    - 参数传递与调用结果
    excludes:
    - 仅通过 URL 打开资源
    - 智能助理触发的系统能力注册
  notes: 保留历史 ID 以维持引用；节点名称和比较对象已中立化。
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
