- id: media.capture.camera
  level: L3
  parent: media.capture
  name:
    zh: 相机捕获管线
    en: Camera Capture Pipeline
  definition: 预览、拍照与录像管线（多世代 API 收在知识演进）。
  knowledge_role: leaf
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: sensitive
  leaf_at_this_level: true
  aliases:
  - Camera2
  - CameraX
  - AVFoundation Capture
  bindings:
    android:
    - kind: package
      id: androidx.camera
      url: https://developer.android.com/jetpack/androidx/releases/camera
      role: primary
      preferred: true
    ios:
    - kind: framework
      id: AVFoundation
      url: https://developer.apple.com/documentation/avfoundation
      role: primary
    harmonyos:
    - kind: kit
      id: CameraKit
      url: https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/camera-overview
      role: primary
  knowledge_path: knowledge/media/capture/camera.yaml
  comparison_scope:
    includes:
    - 预览、拍照与录像管线（多世代 API 收在知识演进）。
