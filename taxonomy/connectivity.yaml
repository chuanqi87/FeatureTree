- id: connectivity.bluetooth.le.scan
  level: L4
  parent: connectivity.bluetooth.le
  name:
    zh: BLE扫描
    en: BLE Scan
  definition: 发现附近 BLE 广播设备。
  knowledge_role: rollup
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  split_justification: task
  bindings:
    android:
    - kind: package
      id: android.bluetooth.le
      url: https://developer.android.com/reference/android/bluetooth/le/package-summary
      role: primary
      since: API 21
    ios:
    - kind: framework
      id: CoreBluetooth
      url: https://developer.apple.com/documentation/corebluetooth
      role: primary
    harmonyos:
    - kind: module
      id: '@ohos.bluetooth.ble'
      url: https://developer.huawei.com/consumer/cn/doc/harmonyos-references/js-apis-bluetooth-ble
      role: primary
      syscap: SystemCapability.Communication.Bluetooth.Core
  knowledge_path: knowledge/connectivity/bluetooth/le/scan/_rollup.yaml
  comparison_scope:
    includes:
    - 发现附近 BLE 广播设备
    - 开始与停止扫描
    - 接收扫描结果
    excludes:
    - 建立连接
    - 读取 GATT 数据
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
- id: connectivity.bluetooth.le.scan.filter
  level: L5
  parent: connectivity.bluetooth.le.scan
  name:
    zh: BLE扫描过滤
    en: BLE Scan Filter
  definition: 按指定条件筛选 BLE 扫描结果，并明确过滤的执行位置与结果语义。
  knowledge_role: leaf
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  leaf_at_this_level: true
  split_justification: presence_and_background_model
  bindings:
    android:
    - kind: class
      id: android.bluetooth.le.ScanFilter
      role: primary
      since: API 21
      url: https://developer.android.com/reference/android/bluetooth/le/ScanFilter
    ios:
    - kind: class
      id: CoreBluetooth.CBCentralManager
      url: https://developer.apple.com/documentation/corebluetooth/cbcentralmanager
      role: primary
      note: 过滤能力弱于 Android，细节见知识
    harmonyos:
    - kind: module
      id: '@ohos.bluetooth.ble'
      url: https://developer.huawei.com/consumer/cn/doc/harmonyos-references/js-apis-bluetooth-ble
      role: primary
      syscap: SystemCapability.Communication.Bluetooth.Core
  knowledge_path: knowledge/connectivity/bluetooth/le/scan/filter.yaml
  comparison_scope:
    includes:
    - 按条件筛选扫描结果
    - 过滤条件的组合与执行位置
    excludes:
    - 批量结果交付
    - 后台执行资格
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
- id: connectivity.bluetooth.le.scan.background
  level: L5
  parent: connectivity.bluetooth.le.scan
  name:
    zh: BLE后台扫描
    en: BLE Background Scan
  definition: 应用不在前台时继续或受限的 BLE 扫描。
  knowledge_role: leaf
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  leaf_at_this_level: true
  split_justification: background
  bindings:
    android:
    - kind: package
      id: android.bluetooth.le
      url: https://developer.android.com/reference/android/bluetooth/le/package-summary
      role: primary
      note: 后台扫描受 Doze/配额约束
    ios:
    - kind: framework
      id: CoreBluetooth
      url: https://developer.apple.com/documentation/corebluetooth
      role: primary
      note: 需蓝牙后台模式
    harmonyos:
    - kind: module
      id: '@ohos.bluetooth.ble'
      url: https://developer.huawei.com/consumer/cn/doc/harmonyos-references/js-apis-bluetooth-ble
      role: primary
  knowledge_path: knowledge/connectivity/bluetooth/le/scan/background.yaml
  comparison_scope:
    includes:
    - 非前台状态下发现 BLE 设备
    - 挂起、唤醒和停止条件
    excludes:
    - 后台任务框架全集
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
  - api_surface
- id: connectivity.bluetooth.le.scan.batch
  level: L5
  parent: connectivity.bluetooth.le.scan
  name:
    zh: BLE批量扫描结果
