domain: notifications
features:
- id: notifications
  level: L1
  parent: null
  name:
    zh: 通知与推送
    en: Notifications and Push
  definition: 本地通知构建展示、远程推送通道、渠道分类、交互动作、角标、实时活动/ongoing 与勿扰策略；不含跨端 Continuity 编排。
  knowledge_role: rollup
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  knowledge_path: knowledge/notifications/_rollup.yaml
  bindings: {}
  comparison_scope:
    includes:
    - 本地通知、推送、渠道、动作、角标、实时活动、勿扰
    excludes:
