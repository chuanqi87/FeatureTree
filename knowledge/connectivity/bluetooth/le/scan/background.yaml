api_surface: 各平台后台声明键名差异属形态，不单独立叶。
legacy_presence:
  android:
    status: partial
    rationale: 可扫，但受电池优化、扫描配额、前台服务类型与权限严格限制。
  ios:
    status: partial
    rationale: 依赖蓝牙后台模式；非任意持续扫描。iOS 26+ Live Activity+CBManager 可放宽部分后台扫描限制。
  harmonyos:
    status: partial
    rationale: 需 ACCESS_BLUETOOTH，并结合后台任务/能效策略；不可假设无限后台扫描。
