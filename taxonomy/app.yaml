  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  knowledge_path: knowledge/app/background/deferred_work/_rollup.yaml
  bindings:
    android:
    - kind: guide
      id: WorkManager
      url: https://developer.android.com/develop/background-work/background-tasks/persistent/getting-started
      role: primary
    ios:
    - kind: class
      id: BGTaskScheduler
      url: https://developer.apple.com/documentation/backgroundtasks/bgtaskscheduler
      role: primary
    harmonyos:
    - kind: module
      id: workScheduler
      url: https://developer.huawei.com/consumer/cn/doc/harmonyos-references/js-apis-workscheduler
      role: primary
  comparison_scope:
    includes:
    - WorkManager、BGTaskScheduler、workScheduler
    excludes:
    - 前台服务见 foreground_task
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
