  - ios
  result: different
  verification: in_review
  scope: 扫描过滤条件与执行位置
  rationale: 历史资料提示条件种类和过滤执行位置不同，需固定 SDK、设备与扫描模式后核实。
  evidence_refs:
  - android-1
  - ios-2
migration_notes:
