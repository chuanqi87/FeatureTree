domain: security
features:
- id: security
  level: L1
  parent: null
  name:
    zh: 安全与隐私
    en: Security and Privacy
  definition: 权限模型、密码学、证书、生物识别、安全存储、证明、设备安全与隐私数据保护。
  knowledge_role: rollup
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  knowledge_path: knowledge/security/_rollup.yaml
  bindings: {}
  comparison_scope:
    includes:
    - 权限、密码学、证书、生物识别、安全存储、证明、设备安全、隐私、数据保护
    excludes:
