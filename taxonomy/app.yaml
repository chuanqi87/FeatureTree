- id: app.lifecycle.activity_ability
  level: L3
  parent: app.lifecycle
  name:
    zh: 界面组件生命周期
    en: UI Component Lifecycle
  definition: 前台界面入口组件的生命周期回调与状态恢复。
  knowledge_role: leaf
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  leaf_at_this_level: true
  split_justification: analog
  bindings:
    android:
    - kind: class
      id: android.app.Activity
      role: primary
      url: https://developer.android.com/reference/android/app/Activity
    ios:
    - kind: class
      id: UIKit.UIViewController
      role: primary
      url: https://developer.apple.com/documentation/uikit/uiviewcontroller
    harmonyos:
    - kind: module
      id: '@ohos.app.ability.UIAbility'
      url: https://developer.huawei.com/consumer/cn/doc/harmonyos-references/js-apis-app-ability-uiability
      role: primary
      syscap: SystemCapability.Ability.AbilityRuntime.Core
  knowledge_path: knowledge/app/lifecycle/activity_ability.yaml
  comparison_scope:
    includes:
    - 前台界面入口组件的生命周期回调与状态恢复。
    excludes: []
  schema_version: 2
  comparison_dimensions:
