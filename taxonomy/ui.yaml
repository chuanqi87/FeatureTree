  knowledge_role: leaf
  layer: os
  device_forms:
  - phone
  - tablet
  privacy_class: none
  aliases:
  - Android View
  - UIKit
  knowledge_path: knowledge/ui/imperative/_rollup.yaml
  bindings: {}
  comparison_scope:
    includes:
    - 显式创建、更新与销毁界面对象
    excludes:
    - 与声明式框架的总体比较文章
  schema_version: 2
  comparison_dimensions:
  - availability
  - programming_model
  - lifecycle_background
  - permissions_privacy
  - limits_precision
  - device_forms
